[package]
name = "nn-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Same reasoning as nn-app's `npp`: the package is named after the workspace,
# the program is named after the editor. A client config says
# `"command": "npp-mcp"`, and the crate name only appears in `use` statements.
[[bin]]
name = "npp-mcp"
path = "src/main.rs"

[dependencies]
# The protocol is JSON-RPC, and the reference is parsed markdown that becomes
# JSON: a hand-written parser and a hand-written serialiser would be two more
# things to test than the protocol itself.
serde_json = "1"
# The plugin tools run the editor's own WebAssembly interpreter over text a
# client sends, and read the editor's configuration directory to find it. Both
# are `nn-core`, which has no window and no renderer: a second implementation of
# the ABI for the protocol would be a second thing for a plugin to be wrong about.
nn-core = { path = "../nn-core" }

[dev-dependencies]
# `fixture` is the two-command plugin in `nn_core::plugin`. A tool that runs a
# command cannot be tested without a module to run, and a copy of the bytes here
# would stop being a plugin the first time the ABI moved.
nn-core = { path = "../nn-core", features = ["fixture"] }
