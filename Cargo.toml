[workspace]
resolver = "2"
members = [
    "crates/nn-core",
    "crates/nn-app",
    # The documentation server: a separate binary with no window dependency, so
    # that a machine can serve the feature reference without building the GUI.
    "crates/nn-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
ropey = "1.6"
memchr = "2.8"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
